
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>COLDTRACK | Monitoring</title>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  background: #101820;
  color: #e8edf2;
  font-family: Arial, sans-serif;
  padding: 25px;
}

header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 30px;
}

h1 {
  color: #45b6fe;
  letter-spacing: 2px;
}

.subtitle {
  color: #8293a3;
  font-size: 12px;
  margin-top: 5px;
}

#connection {
  background: #583b24;
  color: #ffbd69;
  padding: 9px 14px;
  border-radius: 20px;
  font-size: 12px;
}

.cards {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 15px;
  margin-bottom: 20px;
}

.card {
  background: #1c2935;
  border: 1px solid #293b4a;
  border-radius: 12px;
  padding: 20px;
}

.card p {
  color: #8fa4b7;
  font-size: 13px;
  margin-bottom: 12px;
}

.value {
  font-size: 30px;
  font-weight: bold;
}

.normal { color: #42d392; }
.alert { color: #ff6262; }

.panel {
  background: #1c2935;
  border: 1px solid #293b4a;
  border-radius: 12px;
  padding: 20px;
  margin-bottom: 20px;
}

.panel h2 {
  font-size: 17px;
  margin-bottom: 20px;
}

.chart-container {
  height: 260px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}

th, td {
  padding: 13px 8px;
  text-align: left;
  border-bottom: 1px solid #344452;
}

th { color: #8fa4b7; }

.badge {
  padding: 6px 9px;
  border-radius: 6px;
  font-size: 11px;
  font-weight: bold;
}

.badge-normal {
  background: #173e34;
  color: #42d392;
}

.badge-alert {
  background: #512a30;
  color: #ff6262;
}

footer {
  text-align: center;
  color: #64788a;
  font-size: 11px;
  margin-top: 25px;
}

@media(max-width: 550px) {
  body { padding: 15px; }
  .value { font-size: 24px; }
  table { font-size: 11px; }
}
</style>
</head>

<body>

<header>
  <div>
    <h1>COLDTRACK</h1>
    <p class="subtitle">INDUSTRIAL TEMPERATURE MONITORING</p>
  </div>

  <span id="connection">CONNECTING...</span>
</header>

<section class="cards">

  <div class="card">
    <p>TEMPERATURA ACTUAL</p>
    <div class="value" id="temperature">-- °C</div>
  </div>

  <div class="card">
    <p>ESTADO DEL SISTEMA</p>
    <div class="value normal" id="systemStatus">
      NORMAL
    </div>
  </div>

  <div class="card">
    <p>LOTE ACTUAL</p>
    <div class="value" id="currentLot">---</div>
  </div>

  <div class="card">
    <p>LECTURAS ALTAS CONSECUTIVAS</p>
    <div class="value" id="highReadings">0 / 2</div>
  </div>

</section>

<section class="panel">

  <h2>Temperature History</h2>

  <div class="chart-container">
    <canvas id="temperatureChart"></canvas>
  </div>

</section>

<section class="panel">

  <h2>Lot Monitoring</h2>

  <table>
    <thead>
      <tr>
        <th>LOT</th>
        <th>TEMP</th>
        <th>HIGH READINGS</th>
        <th>STATUS</th>
      </tr>
    </thead>

    <tbody id="lotTable">
      <tr>
        <td colspan="4">Waiting for ESP32 data...</td>
      </tr>
    </tbody>
  </table>

</section>

<footer>
  COLDTRACK IoT SYSTEM | ESP32 + MQTT
</footer>

<script>

// ---------------- MQTT ----------------

const TOPIC = "coldtrack/demo-esp32/telemetry";

const client = mqtt.connect(
  "wss://broker.emqx.io:8084/mqtt"
);

const connection = document.getElementById("connection");

client.on("connect", () => {

  connection.textContent = "ONLINE";
  connection.style.background = "#173e34";
  connection.style.color = "#42d392";

  client.subscribe(TOPIC);

});

client.on("offline", () => {
  connection.textContent = "OFFLINE";
});

client.on("error", (error) => {
  console.error("MQTT error:", error);
});

client.on("message", (topic, message) => {

  try {

    const data = JSON.parse(message.toString());

    updateDashboard(data);

  } catch (error) {

    console.error("Invalid data:", error);

  }

});

// ---------------- LOT DATA ----------------

const lots = {};

const history = [];

let chart;

// ---------------- CHART ----------------

function initializeChart() {

  const ctx = document
    .getElementById("temperatureChart");

  chart = new Chart(ctx, {

    type: "line",

    data: {
      labels: [],

      datasets: [{
        label: "Temperature °C",
        data: [],
        borderColor: "#45b6fe",
        backgroundColor: "rgba(69,182,254,0.12)",
        fill: true,
        tension: 0.35
      }]
    },

    options: {
      responsive: true,
      maintainAspectRatio: false,

      scales: {
        y: {
          min: 4,
          max: 12,
          grid: { color: "#344452" },
          ticks: { color: "#8fa4b7" }
        },

        x: {
          grid: { display: false },
          ticks: { color: "#8fa4b7" }
        }
      },

      plugins: {
        legend: {
          labels: { color: "#e8edf2" }
        }
      }
    }

  });

}

// ---------------- DASHBOARD ----------------

function updateDashboard(data) {

  const temp = Number(data.temperature);
  const lot = data.lot;

  if (!Number.isFinite(temp) ||
      typeof lot !== "string" ||
      typeof data.alarm !== "boolean") {
    return;
  }

  // Guardar información del lote
  lots[lot] = {
    temperature: temp,
    high: Number(data.high_lecture),
    alarm: data.alarm
  };

  // Actualizar tarjetas
  document.getElementById("temperature")
    .textContent = temp.toFixed(1) + " °C";

  document.getElementById("currentLot")
    .textContent = lot;

  document.getElementById("highReadings")
    .textContent = data.high_lecture + " / 2";

  const status = document.getElementById("systemStatus");

  const anyAlarm = Object.values(lots)
    .some(item => item.alarm);

  status.textContent = anyAlarm ? "ALERT" : "NORMAL";

  status.className = "value " +
    (anyAlarm ? "alert" : "normal");

  // Historial
  history.push({
    lot: lot,
    temperature: temp
  });

  if (history.length > 20) {
    history.shift();
  }

  // Actualizar gráfica
  chart.data.labels = history.map(
    (item, index) => item.lot + " #" + (index + 1)
  );

  chart.data.datasets[0].data = history.map(
    item => item.temperature
  );

  chart.update("none");

  // Actualizar tabla
  renderTable();

}

// ---------------- TABLE ----------------

function renderTable() {

  const table = document.getElementById("lotTable");

  table.innerHTML = "";

  Object.entries(lots).forEach(([lot, data]) => {

    const row = document.createElement("tr");

    const status = data.alarm
      ? '<span class="badge badge-alert">ALERT</span>'
      : '<span class="badge badge-normal">NORMAL</span>';

    row.innerHTML = `
      <td>${lot}</td>
      <td>${data.temperature.toFixed(1)} °C</td>
      <td>${data.high}</td>
      <td>${status}</td>
    `;

    table.appendChild(row);

  });

}

// Inicializar gráfica
initializeChart();

</script>

</body>
</html>
